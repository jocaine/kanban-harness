services:
  web:
    build: .
    network_mode: host
    command: python3 -m uvicorn main:app --host 0.0.0.0 --port 8766 --reload --no-access-log
    volumes:
      - .:/app
      - ./data:/app/data
      - ./docker/hermes/config.yaml:/root/.hermes/config.yaml
      - kh-worktrees:/tmp/kh-worktrees
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - DB_PATH=data/kanban.db
      - HOME=/root
      - KH_WORKSPACE=/app/data/workspaces
      - KH_HOST_WORKSPACE=/home/tlr/kanban_harness/data/workspaces
      - KH_DAEMON_URL=http://127.0.0.1:8770
      - SEARXNG_URL=http://localhost:8888
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8766/api/projects')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  firecrawl-lite:
    build: docker/firecrawl-lite
    container_name: kh-firecrawl
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  searxng:
    image: searxng/searxng:latest
    container_name: kh-searxng
    network_mode: host
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./docker/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - BIND_ADDRESS=0.0.0.0:8888
      - GRANIAN_PORT=8888
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kh-worktrees:
