services:
  web:
    build: .
    network_mode: host
    volumes:
      - .:/app
      - ./data:/app/data
      - ./docker/hermes/config.yaml:/root/.hermes/config.yaml
      - kh-worktrees:/tmp/kh-worktrees
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - DB_PATH=data/kanban.db
      - HOME=/root
      - SEARXNG_URL=http://localhost:8888
      - OPENAI_API_KEY=${API_KEY}
      - OPENAI_BASE_URL=${API_BASE_URL}
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/projects')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  searxng:
    image: searxng/searxng:latest
    container_name: kh-searxng
    network_mode: host
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./docker/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - BIND_ADDRESS=0.0.0.0:8888
      - GRANIAN_PORT=8888
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kh-worktrees:
