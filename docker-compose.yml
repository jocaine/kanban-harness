services:
  web:
    build: .
    network_mode: host
    volumes:
      - .:/app
      - ./data:/app/data
      - kh-worktrees:/tmp/kh-worktrees
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - DB_PATH=data/kanban.db
      - HOME=/root
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/projects')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kh-worktrees:
