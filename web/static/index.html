<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>需求管理系统</title>
    <link rel="stylesheet" href="static/style.css?v=50">
    <script src="static/lib/marked.min.js"></script>
    <script src="static/lib/purify.min.js"></script>
</head>
<body>
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1 class="logo">ReqFlow</h1>
        </div>
        <div class="sidebar-section">
            <div class="section-title">
                <span>项目</span>
                <button class="btn-icon" onclick="showProjectModal()" title="新建项目">+</button>
            </div>
            <div id="project-list" class="nav-list"></div>
        </div>
        <div class="sidebar-section" id="version-section" style="display:none">
            <div class="section-title">
                <span id="version-section-label">版本</span>
                <button class="btn-icon" onclick="showVersionModal()" title="新建版本">+</button>
            </div>
            <div id="version-list" class="nav-list"></div>
        </div>
        <div class="sidebar-footer">
            <div class="stats-mini" id="sidebar-stats"></div>
            <div class="app-version" id="app-version"></div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="main">
        <!-- Agent 活动条 + 暂停按钮 -->
        <div class="activity-bar" id="activity-bar">
            <div class="activity-info" id="activity-info">
                <span class="activity-idle">AI 团队空闲</span>
            </div>
            <button class="scheduler-toggle running" id="scheduler-toggle" onclick="toggleScheduler()">
                <span class="toggle-dot"></span>
                <span class="toggle-label">AI 运行中</span>
            </button>
        </div>

        <!-- 欢迎页 -->
        <div class="welcome" id="welcome-view">
            <div class="welcome-icon">&#128203;</div>
            <h2>需求管理系统</h2>
            <p>选择左侧项目和版本，或创建一个新项目开始</p>
            <button class="btn-primary" onclick="showProjectModal()">创建第一个项目</button>
            <button class="btn-arch" id="btn-welcome-arch" style="display:none" onclick="showDocView('arch')">查看架构文档</button>
        </div>

        <!-- 需求看板视图 -->
        <div class="board-view" id="board-view" style="display:none">
            <div class="board-header">
                <div class="board-title">
                    <h2 id="board-title-text"></h2>
                    <span class="version-badge" id="board-version-badge"></span>
                    <span class="prod-target-badge" id="prod-target-badge" style="display:none"></span>
                </div>
                <div class="board-actions">
                    <div class="view-toggle">
                        <button class="toggle-btn active" id="btn-board-mode" onclick="switchView('board')">看板</button>
                        <button class="toggle-btn" id="btn-tag-mode" onclick="switchView('tag')" style="display:none">标签</button>
                        <button class="toggle-btn" id="btn-arch-mode" onclick="switchView('arch')">智能团队</button>
                    </div>
                    <input type="text" id="search-input" placeholder="搜索需求 / 输入编号跳转..." class="search-input" oninput="onSearchInput()" onkeydown="if(event.key==='Enter')onSearchEnter()"/>
                    <select id="filter-priority" class="filter-select" onchange="onFilterChange()">
                        <option value="">全部优先级</option>
                        <option value="P0">P0 紧急</option>
                        <option value="P1">P1 高</option>
                        <option value="P2">P2 中</option>
                        <option value="P3">P3 低</option>
                    </select>
                    <button class="btn-primary" onclick="showReqModal()">+ 新建需求</button>
                </div>
            </div>
            <!-- 可折叠描述区域（看板视图：版本描述 / 标签视图：标签描述） -->
            <details class="desc-collapsible" id="desc-collapsible" style="display:none">
                <summary class="desc-toggle" id="desc-toggle-label">版本介绍</summary>
                <div class="desc-body md-content" id="desc-body"></div>
            </details>
            <div class="board-columns" id="board-columns"></div>

            <!-- 标签视图 -->
            <div class="tag-view" id="tag-view" style="display:none">
                <div class="tag-list" id="tag-list"></div>
                <div class="tag-detail" id="tag-detail" style="display:none"></div>
            </div>
        </div>

        <!-- 项目文档视图（架构/Advisor Skill/产品记忆） -->
        <div class="arch-view" id="arch-view" style="display:none">
            <div class="arch-header">
                <h2 id="arch-title"></h2>
                <button class="btn-cancel" onclick="hideArchView()">返回</button>
            </div>
            <div class="doc-tabs" id="doc-tabs">
                <button class="doc-tab active" data-tab="team" onclick="switchDocTab('team')">AI 团队</button>
                <button class="doc-tab" data-tab="memory" onclick="switchDocTab('memory')">产品记忆</button>
                <button class="doc-tab" data-tab="arch" onclick="switchDocTab('arch')">架构文档</button>
                <button class="doc-tab" data-tab="wiki" onclick="switchDocTab('wiki')">Wiki</button>
            </div>
            <div class="team-view" id="team-view">
                <div class="team-workflow" id="team-workflow"></div>
                <div class="token-cost-card" id="token-cost-card"></div>
                <div class="team-memory-section">
                    <div class="section-title" style="padding:16px 0 8px;font-size:13px;font-weight:600;color:var(--text2)">
                        📋 产品记忆摘要
                    </div>
                    <div id="product-memory-summary" class="memory-summary"></div>
                </div>
                <div class="team-grid" id="team-grid"></div>
            </div>
            <div class="arch-content md-content" id="arch-content" style="display:none"></div>
            <div class="wiki-view" id="wiki-view" style="display:none">
                <div class="wiki-page-list" id="wiki-page-list"></div>
                <div class="wiki-page-content md-content" id="wiki-page-content"></div>
            </div>
            <div class="arch-actions" id="arch-actions">
            </div>
        </div>

        </div>
    </main>

    <!-- 项目弹窗 -->
    <div class="modal-overlay hidden" id="project-modal" onclick="closeModal('project-modal', event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="project-modal-title">新建项目</h3>
                <button class="modal-close" onclick="hideModal('project-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <label>项目名称 <span class="req">*</span></label>
                <input type="text" id="proj-name" placeholder="例如：商城系统" />
                <label>项目描述</label>
                <textarea id="proj-desc" rows="3" placeholder="简要描述项目目标"></textarea>
                <label>主题色</label>
                <div class="color-picker" id="color-picker">
                    <button class="color-dot selected" data-color="#4f46e5" style="background:#4f46e5" onclick="pickColor(this)"></button>
                    <button class="color-dot" data-color="#0891b2" style="background:#0891b2" onclick="pickColor(this)"></button>
                    <button class="color-dot" data-color="#059669" style="background:#059669" onclick="pickColor(this)"></button>
                    <button class="color-dot" data-color="#d97706" style="background:#d97706" onclick="pickColor(this)"></button>
                    <button class="color-dot" data-color="#dc2626" style="background:#dc2626" onclick="pickColor(this)"></button>
                    <button class="color-dot" data-color="#7c3aed" style="background:#7c3aed" onclick="pickColor(this)"></button>
                    <button class="color-dot" data-color="#db2777" style="background:#db2777" onclick="pickColor(this)"></button>
                    <button class="color-dot" data-color="#475569" style="background:#475569" onclick="pickColor(this)"></button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="hideModal('project-modal')">取消</button>
                <button class="btn-primary" onclick="saveProject()">保存</button>
            </div>
        </div>
    </div>

    <!-- 移动确认弹窗 -->
    <div class="modal-overlay hidden" id="move-confirm-modal" onclick="closeModal('move-confirm-modal', event)">
        <div class="modal modal-sm" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>确认移动</h3>
                <button class="modal-close" onclick="cancelMove()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="move-confirm-desc" style="margin-bottom:12px;color:#64748b;"></p>
                <label>移动原因 / 说明 <span class="req">*</span></label>
                <textarea id="move-confirm-reason" rows="3" placeholder="请说明为什么移动这张卡片..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="cancelMove()">取消</button>
                <button class="btn-primary" onclick="confirmMove()">确认移动</button>
            </div>
        </div>
    </div>

    <!-- 版本弹窗 -->
    <div class="modal-overlay hidden" id="version-modal" onclick="closeModal('version-modal', event)">
        <div class="modal modal-sm" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="version-modal-title">新建版本</h3>
                <button class="modal-close" onclick="hideModal('version-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <label>版本号 <span class="req">*</span></label>
                <input type="text" id="ver-name" placeholder="例如：v1.0.0" />
                <label>版本说明</label>
                <textarea id="ver-desc" rows="2" placeholder="本版本主要目标"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="hideModal('version-modal')">取消</button>
                <button class="btn-primary" onclick="saveVersion()">保存</button>
            </div>
        </div>
    </div>

    <!-- 需求弹窗（Tab 布局） -->
    <div class="modal-overlay hidden" id="req-modal" onclick="closeModal('req-modal', event)">
        <div class="modal modal-lg" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="req-modal-title">新建需求</h3>
                <div style="display:flex;align-items:center;gap:4px">
                    <button class="btn-fullscreen" id="btn-fullscreen" onclick="toggleFullscreen()" title="全屏">&#x26F6;</button>
                    <button class="modal-close" onclick="hideModal('req-modal')">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <!-- 快速输入（新建模式） -->
                <div id="req-quick-input">
                    <p style="margin:0 0 12px;color:var(--text2);font-size:13px">告诉 AI 团队你想做什么，PM 会帮你整理成需求卡片。</p>
                    <textarea id="req-idea-input" rows="8" placeholder="说说你的想法，用人话就行...&#10;&#10;例如：&#10;• 我想加一个数据导出功能，支持 CSV 格式&#10;• 首页加载太慢了，优化一下性能&#10;• 做一个用户反馈收集页面，能打标签分类"></textarea>
                    <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
                        <select id="req-quick-priority" style="width:auto;padding:6px 10px;font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text)">
                            <option value="P2">普通优先级</option>
                            <option value="P0">P0 紧急</option>
                            <option value="P1">P1 高</option>
                            <option value="P3">P3 低</option>
                        </select>
                        <span style="color:var(--text3);font-size:11px">提交后 PM 会自动拆解和排期</span>
                    </div>
                </div>

                <!-- 完整表单（编辑模式） -->
                <div id="req-full-form" style="display:none">
                <!-- 标题行（始终可见） -->
                <input type="text" id="req-title" placeholder="需求标题" />

                <!-- Tab 导航 -->
                <div class="req-tabs">
                    <button class="req-tab active" data-tab="desc" onclick="switchReqTab('desc')">描述</button>
                    <button class="req-tab" data-tab="comments" onclick="switchReqTab('comments')">评论</button>
                    <button class="req-tab" data-tab="notes" onclick="switchReqTab('notes')">备注</button>
                    <button class="req-tab" data-tab="meta" onclick="switchReqTab('meta')">优先级与附件</button>
                </div>

                <!-- Tab: 描述 -->
                <div class="req-tab-content active" id="tab-desc">
                    <label>描述 <span class="hint">支持 Markdown</span>
                        <button type="button" class="btn-preview" id="btn-desc-preview" onclick="toggleDescPreview()">预览</button>
                    </label>
                    <textarea id="req-desc" rows="8" placeholder="支持 Markdown：# 标题、**粗体**、- 列表、`代码`、| 表格 |" oninput="updateDescPreview()"></textarea>
                    <div id="req-desc-preview" class="md-preview hidden"></div>
                </div>

                <!-- Tab: 评论 -->
                <div class="req-tab-content" id="tab-comments">
                    <div id="comment-list" class="comment-list"></div>
                    <div class="comment-input-area">
                        <textarea id="comment-input" rows="3" placeholder="添加评论，支持 Markdown..."></textarea>
                        <button class="btn-primary btn-sm" onclick="addComment()">发送</button>
                    </div>
                </div>

                <!-- Tab: 备注 -->
                <div class="req-tab-content" id="tab-notes">
                    <label>备注</label>
                    <textarea id="req-notes" rows="8" placeholder="完成说明、技术方案、已知限制"></textarea>
                </div>

                <!-- Tab: 优先级与附件 -->
                <div class="req-tab-content" id="tab-meta">
                    <div class="form-row">
                        <div class="form-group">
                            <label>优先级</label>
                            <select id="req-priority">
                                <option value="P0">P0 紧急</option>
                                <option value="P1">P1 高</option>
                                <option value="P2" selected>P2 中</option>
                                <option value="P3">P3 低</option>
                            </select>
                        </div>
                        <div class="form-group" id="req-status-group" style="display:none">
                            <label>状态</label>
                            <select id="req-status">
                                <option value="organizing" selected>需求整理</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>类型</label>
                            <select id="req-type">
                                <option value="dev">开发需求</option>
                                <option value="research">调研需求</option>
                            </select>
                        </div>
                        <div class="form-group"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>负责人</label>
                            <input type="text" id="req-assignee" style="display:none" />
                        </div>
                        <div class="form-group">
                            <label>截止日期</label>
                            <input type="date" id="req-deadline" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>预估工时(h)</label>
                            <input type="number" id="req-hours" min="0" step="0.5" value="0" />
                        </div>
                        <div class="form-group">
                            <label>实际工时(h)</label>
                            <input type="number" id="req-actual" min="0" step="0.5" value="0" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label>标签 <span class="hint">逗号分隔</span></label>
                            <input type="text" id="req-tags" placeholder="例如：feature, UI, 后端" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label>排队原因</label>
                            <div class="queue-reason-row">
                                <select id="req-queue-reason-preset" onchange="onQueueReasonPresetChange(this)">
                                    <option value="">自定义</option>
                                    <option value="waiting_reply">等待回复</option>
                                    <option value="waiting_dependency">等待依赖</option>
                                    <option value="waiting_turn">排队等待</option>
                                    <option value="need_info">缺信息</option>
                                    <option value="deferred">推迟</option>
                                </select>
                                <input type="text" id="req-queue-reason" placeholder="具体排队原因说明" />
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label>附件</label>
                            <div class="attachment-area">
                                <div id="attachment-list" class="attachment-list"></div>
                                <label class="upload-btn">
                                    <input type="file" id="file-upload" multiple style="display:none" onchange="handleFileSelect(this)" />
                                    + 上传文件
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row" id="commits-section" style="display:none">
                        <div class="form-group flex-1">
                            <div id="commits-list"></div>
                        </div>
                    </div>
                </div>
                </div><!-- end req-full-form -->
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="hideModal('req-modal')">取消</button>
                <button class="btn-primary" onclick="saveRequirement()">保存</button>
            </div>
        </div>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel" id="chat-panel" style="display:none">
        <div class="chat-header">
            <img class="chat-header-avatar" src="/static/avatars/pm_avatar.png" id="chat-role-avatar">
            <div class="chat-header-info">
                <span class="chat-header-title">AI 团队</span>
                <span class="chat-header-project" id="chat-project-label">未选择项目</span>
            </div>
            <button class="btn-icon" onclick="clearChatHistory()" title="清除历史">🗑</button>
            <button class="btn-icon" onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
            <textarea id="chat-input" rows="1" placeholder="输入消息... (Shift+Enter 换行)" oninput="autoGrowInput(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
            <button class="btn-primary btn-sm" id="chat-send-btn" onclick="sendChat()">发送</button>
        </div>
    </div>
    <button class="chat-fab" id="chat-fab" onclick="toggleChat()" title="AI 对话" style="display:none">💬</button>

    <!-- Reigns-style CEO Decision Overlay -->
    <div class="decision-overlay" id="decision-overlay">
        <button class="decision-close" onclick="closeDecision()">&times;</button>
        <div class="decision-container">
            <div class="decision-speaker">
                <div class="decision-chat-row">
                    <div class="decision-avatar-wrap">
                        <img class="decision-avatar" id="decision-avatar" src="/static/avatars/pm_avatar.png" />
                        <span class="decision-avatar-q" id="decision-avatar-q">?</span>
                        <div class="decision-role-name" id="decision-role-name">产品经理</div>
                        <div class="decision-role-title" id="decision-role-title">需求拆解</div>
                    </div>
                    <div class="decision-speech-wrap">
                        <div class="decision-speech" id="decision-speech"></div>
                    </div>
                </div>
                <div class="decision-actions" id="decision-actions"></div>
                <div class="decision-custom">
                    <textarea id="decision-input" placeholder="或者直接说你的想法..."></textarea>
                    <button onclick="submitCustomDecision()">发送</button>
                </div>
            </div>
            <div class="decision-card" id="decision-card"></div>
        </div>
    </div>

    <!-- Dev Log Overlay -->
    <div class="log-overlay hidden" id="log-overlay" onclick="closeLogViewer(event)">
        <div class="log-panel" onclick="event.stopPropagation()">
            <div class="log-header">
                <h3>容器日志</h3>
                <div class="log-view-tabs">
                    <button class="log-view-tab active" data-mode="type" onclick="switchLogView('type')">按类型</button>
                    <button class="log-view-tab" data-mode="layer" onclick="switchLogView('layer')">按层次</button>
                </div>
                <div class="log-actions">
                    <button class="btn-icon" id="log-refresh-btn" onclick="refreshLogs()" title="刷新">↻</button>
                    <button class="btn-icon" onclick="closeLogViewer()">&times;</button>
                </div>
            </div>
            <div class="log-filters" id="log-filters"></div>
            <div class="log-card-filter" id="log-card-filter">
                <input type="text" id="log-card-input" placeholder="按卡片编号筛选 (如 KH-086)" oninput="filterLogByCard(this.value)">
                <button class="btn-icon" onclick="clearCardFilter()" title="清除">&times;</button>
            </div>
            <pre class="log-content" id="log-content">加载中...</pre>
        </div>
    </div>

    <!-- Detail Overlay -->
    <div id="detail-overlay" style="display:none"></div>

    <script src="static/app.js?v=50"></script>
</body>
</html>
