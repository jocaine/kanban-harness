_config_version: 23
agent:
  max_turns: 90
  reasoning_effort: medium
  tool_use_enforcement: auto
  verbose: false
approvals:
  mode: yolo
compression:
  enabled: true
  threshold: 0.5
display:
  personality: ''
  streaming: true
logging:
  level: INFO
mcp_servers:
  kanban:
    args:
    - /app/mcp_server/agent_server.py
    command: /usr/local/bin/python3
    env:
      DB_PATH: data/kanban.db
      KH_AGENT_ROLE: industry
      KH_PROJECT_ID: '0'
    type: stdio
memory:
  memory_enabled: false
model:
  base_url: http://192.168.3.15:8317/v1
  default: claude-opus-4-6
  provider: custom
platform_toolsets:
  cli:
  - browser
  - web
  - mcp-kanban
  - file
  - terminal
  - skills
security:
  allow_private_urls: true
toolsets:
- hermes-cli
web:
  extract_backend: firecrawl
  search_backend: searxng
